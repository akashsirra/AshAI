<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshAI Mission Control</title><style>body{font-family:system-ui;background:#090b10;color:#eee;max-width:1000px;margin:auto;padding:24px}textarea,input,button{font:inherit}textarea{width:100%;min-height:110px;background:#11151d;color:#fff;border:1px solid #303744;border-radius:10px;padding:12px;box-sizing:border-box}button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;cursor:pointer}.card{background:#11151d;border:1px solid #252b36;border-radius:12px;padding:16px;margin:14px 0}pre{white-space:pre-wrap;overflow:auto;color:#b9c4d4}.status{font-weight:700}small{color:#8993a3}</style></head><body><h1>AshAI Mission Control</h1><p>Give AshAI a goal. It plans, executes tools, collects evidence, verifies, and delivers.</p><textarea id="goal" placeholder="Build / inspect / analyze something..."></textarea><br><button onclick="run()">Launch mission</button><div id="out"></div><script>async function run(){const goal=document.getElementById('goal').value.trim();if(!goal)return;out.innerHTML='<div class=card>Running...</div>';const r=await fetch('/api/missions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal})});const d=await r.json();render(d)}function render(d){const m=d.mission;out.innerHTML='<div class=card><div class=status>'+m.status+'</div><small>'+m.id+'</small><h2>Result</h2><pre>'+esc(m.result||m.error||'Waiting for approval')+'</pre><h2>Plan</h2><pre>'+esc(JSON.stringify(m.plan,null,2))+'</pre><h2>Timeline</h2><pre>'+esc(JSON.stringify(d.events,null,2))+'</pre>'+(m.status==='waiting_approval'?'<button onclick="approve(\''+m.id+'\')">Approve & resume</button>':'')+'</div>'}async function approve(id){const r=await fetch('/api/missions/'+id+'/approve',{method:'POST'});render(await r.json())}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</script></body></html>
