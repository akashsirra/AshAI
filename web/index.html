<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AshAI Mission Control</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#eef2f7;font:15px system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.brand{font-size:28px;font-weight:800;letter-spacing:-.04em}.muted{color:#8b96a8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}.card{background:#10141c;border:1px solid #232a36;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 30px #0003}textarea{width:100%;min-height:130px;resize:vertical;background:#0b0e14;color:#fff;border:1px solid #303846;border-radius:12px;padding:14px;outline:none}button{background:#e9eef6;color:#080a0f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#202733;color:#dce4ef}button:disabled{opacity:.5}.status{display:inline-flex;padding:5px 9px;border-radius:999px;background:#1d2633;font-weight:700}.status.completed{background:#173a28;color:#8ff0b4}.status.failed{background:#3d1c22;color:#ff9ca8}.status.waiting_approval{background:#3b3014;color:#ffd878}.bar{height:6px;background:#202733;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;width:40%;background:#8fb8ff;transition:width .3s}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.mono,pre{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow:auto;color:#bdc8d8}h1,h2{margin:0 0 8px}.steps{display:grid;gap:8px}.step{padding:10px;border:1px solid #242c38;border-radius:10px}.timeline{max-height:430px;overflow:auto}.empty{padding:30px;text-align:center;color:#758095}
</style></head>
<body><main>
<div class="top"><div><div class="brand">AshAI</div><div class="muted">Mission Control — goal → plan → tools → evidence → verification → delivery</div></div><button class="secondary" onclick="loadMissions()">Refresh</button></div>
<div class="card"><h2>Launch mission</h2><p class="muted">Give AshAI an outcome. It will plan and execute a bounded mission in the configured workspace.</p><textarea id="goal" placeholder="Example: Inspect this project, run its verification, identify evidence-backed improvements, and produce a concise report."></textarea><div class="row"><span id="health" class="muted">Checking engine…</span><button id="launch" onclick="launch()">Launch</button></div></div>
<div id="current"></div><div class="grid"><section><div class="card"><h2>Mission history</h2><div id="history" class="steps"><div class="empty">No missions yet.</div></div></div></section><section><div class="card"><h2>Runtime</h2><div id="tools" class="steps"><div class="empty">Loading tools…</div></div></div></section></div>
</main><script>
const $=id=>document.getElementById(id);let timer=null;
async function api(path,opts){const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function health(){try{const h=await api('/api/health');$('health').textContent=`${h.provider?'Groq':'Fallback'} · ${h.agentLoop?'agent loop on':'agent loop off'} · v${h.version}`}catch(e){$('health').textContent='Engine unavailable'}}
async function loadTools(){try{const tools=await api('/api/tools');$('tools').innerHTML=tools.map(t=>`<div class="step"><b>${esc(t.name)}</b><div class="muted">${esc(t.description)}</div>${t.requiresApproval?'<small>Approval required</small>':''}</div>`).join('')}catch(e){$('tools').innerHTML='<div class="empty">Unable to load tools.</div>'}}
async function loadMissions(){try{const ms=await api('/api/missions');$('history').innerHTML=ms.length?ms.slice().reverse().map(m=>`<div class="step"><div class="row"><b>${esc(m.goal.slice(0,70))}</b><span class="status ${m.status}">${esc(m.status)}</span></div><small class="muted">${esc(m.id)}</small></div>`).join(''):'<div class="empty">No missions yet.</div>'}catch(e){}}
async function launch(){const goal=$('goal').value.trim();if(!goal)return;const b=$('launch');b.disabled=true;clearInterval(timer);$('current').innerHTML='<div class="card"><div class="row"><h2>Starting…</h2><span class="status">planning</span></div><div class="bar"><i></i></div></div>';try{const d=await api('/api/missions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal,autoRun:false})});render(d);poll(d.mission.id)}catch(e){$('current').innerHTML=`<div class="card"><span class="status failed">error</span><pre>${esc(e.message)}</pre></div>`}finally{b.disabled=false;loadMissions()}}
async function poll(id){timer=setInterval(async()=>{try{const d=await api('/api/missions/'+encodeURIComponent(id));render(d);if(['completed','failed'].includes(d.mission.status))clearInterval(timer)}catch(e){clearInterval(timer)}},700);}
function render(d){const m=d.mission;const done=m.plan.filter(s=>s.status==='completed').length;const pct=m.plan.length?Math.round(done/m.plan.length*100):8;const approve=m.status==='waiting_approval'?`<button onclick="approve('${esc(m.id)}')">Approve & resume</button>`:'';$('current').innerHTML=`<div class="card"><div class="row"><div><h2>Mission</h2><small class="muted mono">${esc(m.id)}</small></div><span class="status ${m.status}">${esc(m.status)}</span></div><div class="bar"><i style="width:${pct}%"></i></div><div class="steps">${m.plan.map(s=>`<div class="step"><div class="row"><b>${esc(s.title)}</b><span class="muted">${esc(s.status)}</span></div><small class="muted">${esc(s.tool||'internal')}</small></div>`).join('')}</div><div style="margin-top:14px">${approve}</div>${m.result?`<h3>Result</h3><pre>${esc(m.result)}</pre>`:''}${m.error?`<h3>Error</h3><pre>${esc(m.error)}</pre>`:''}<details><summary>Timeline</summary><div class="timeline"><pre>${esc(JSON.stringify(d.events,null,2))}</pre></div></details></div>`;loadMissions()}
async function approve(id){try{render(await api('/api/missions/'+id+'/approve',{method:'POST'}));poll(id)}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}
health();loadTools();loadMissions();
</script></body></html>
